<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Header Clone</title>
  <link rel="stylesheet" href="amz.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-logo">
      <span class="logo-text">amazon<span class="logo-domain">.in</span></span>
    </div>


    <div class="nav-location">
      <p class="small-text">Deliver to</p>
      <p class="bold-text">India</p>
    </div>

    <div class="nav-search">
      
      <input type="text" class="search-input" placeholder="Search Amazon">
      
      <button class="search-button">search</button>
    </div>


    <div class="nav-language">
      <span class="flag">🇮🇳</span>
      <span class="bold-text">EN</span>
    </div>

    <div class="nav-account">
      <p class="small-text">Hello, sign in</p>
      <p class="bold-text">Account & Lists</p>
    </div>


    <div class="nav-orders">
      <p class="small-text">Returns</p>
      <p class="bold-text">& Orders</p>
    </div>

    <div class="nav-cart">
      <span class="cart-icon">🛒</span>
      <span class="bold-text">Cart</span>
    </div>

  </header>

</body>
</html>
